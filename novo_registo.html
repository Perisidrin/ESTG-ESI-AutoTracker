<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>AutoTracker - Novo Registo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-slate-100 font-sans text-slate-800">
    <nav class="bg-slate-900 p-4 text-white flex justify-between items-center shadow-md">
        <div class="text-2xl font-bold tracking-wider"><i class="fa-solid fa-car-side mr-2"></i>AutoTracker</div>
        <a href="/" class="text-sm hover:underline"><i class="fa-solid fa-arrow-left mr-1"></i> Voltar ao Painel</a>
    </nav>

    <div class="max-w-xl mx-auto mt-10 p-6 bg-white rounded-xl shadow-sm border border-slate-200">
        <h2 class="font-bold text-xl mb-6 border-b pb-2"><i class="fa-solid fa-plus-circle mr-2 text-slate-500"></i>Adicionar Registo</h2>
        
        <form method="POST">
            <div class="mb-4">
                <label class="block text-sm font-semibold mb-1 text-slate-600">Tipo de Registo</label>
                <select name="tipo" class="w-full border border-slate-300 rounded p-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <option value="Combustível" {% if tipo == 'Combustível' %}selected{% endif %}>Abastecimento de Combustível</option>
                    <option value="Oficina" {% if tipo == 'Oficina' %}selected{% endif %}>Manutenção / Oficina</option>
                </select>
            </div>

            <div class="mb-4">
                <label class="block text-sm font-semibold mb-1 text-slate-600">Data</label>
                <input type="date" name="data" required class="w-full border border-slate-300 rounded p-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <div class="mb-4">
                <label class="block text-sm font-semibold mb-1 text-slate-600">Valor Gasto (€)</label>
                <input type="number" step="0.01" name="valor" placeholder="Ex: 45.50" required class="w-full border border-slate-300 rounded p-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <div class="mb-6">
                <label class="block text-sm font-semibold mb-1 text-slate-600">Descrição / Local</label>
                <input type="text" name="descricao" placeholder="Ex: Gasolina 95 na Repsol" required class="w-full border border-slate-300 rounded p-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <div class="flex justify-end gap-2">
                <a href="/" class="bg-slate-200 text-slate-700 px-4 py-2 rounded hover:bg-slate-300">Cancelar</a>
                <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 font-semibold shadow-sm">Guardar Registo</button>
            </div>
        </form>
    </div>
</body>
</html>
